name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ドキュメント整合（構成ツリー・文書の数値・再掲）。pytest でも収集されるが、
      # 標準ライブラリのみで動くので **依存 install より前**に置く。install が失敗しても
      # 文書のズレは検出でき、失敗時に「どの記載がズレたか」を単体で読める。
      - name: Doc integrity
        run: |
          for t in tests/test_doc_tree.py tests/test_doc_facts.py tests/test_doc_dedup.py; do
            echo "--- $t"
            python3 "$t" || exit 1
          done

      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --with dev --no-interaction
      - name: Ruff
        run: poetry run ruff check .
      - name: Mypy
        run: poetry run mypy src
      - name: Pytest
        run: poetry run pytest -q
