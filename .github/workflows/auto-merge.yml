name: auto-merge
on:
  pull_request:
    # edited: base を後から main へ向け直した PR も拾う（opened 時点の base しか見ないため）。
    # synchronize: 既に開いている PR は opened を二度と出さない。予約が付かなかった PR
    # (force push で切り直した・導入前から開いていた) が、直しても押しても入らず残るのを防ぐ。
    # `gh pr merge --auto` は冪等なので、push のたびに呼んで構わない。
    types: [opened, reopened, ready_for_review, edited, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    # draft は対象外（作業中の PR を勝手にマージしない）。
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR の URL は env 経由で渡す（式を直接 run に埋めない＝injection 対策）。
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch
